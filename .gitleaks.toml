title = "toto-wolff gitleaks config"

paths-ignore = [
  '''pnpm-lock\.yaml''',
  '''pnpm-workspace\.yaml''',
  '''package-lock\.json''',
  '''yarn\.lock''',
  '''**/ci\.yml''',
]

[allowlist]
description = "Allow example placeholders and test fixtures"
regexes = [
  '''<YOUR_[A-Z_]+>''',
  '''example-key''',
  '''test-key''',
  '''placeholder''',
  '''@aws-sdk/credential-provider-''',
  '''@aws-sdk/token-providers''',
  '''@smithy/credential-provider-imds''',
  '''credential-provider-''',
  '''token-providers''',
  '''sk-ci-smoke-test-placeholder-not-real''',
  '''REDACTED=sk-ci-smoke-test-placeholder-not-real''',
  '''ANTHROPIC_API_KEY=sk-ci-smoke-test-placeholder-not-real''',
  '''ANTHROPIC_API_KEY=''',
  '''ANTHROPIC_API_KEY''',
]

[[rules]]
id = "manifest-auth-token"
description = "Manifest auth token"
regex = '''mnfst_[A-Za-z0-9_\-]{20,}'''
tags = ["token", "manifest"]
[rules.allowlist]
regexes = [
  '''<your-manifest-token>''',
]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9\-_]{40,}'''
tags = ["key", "anthropic"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key assignment"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)\s*[=:]\s*['""]?[a-zA-Z0-9\-_]{20,}['""]?'''
tags = ["key", "generic"]
[rules.allowlist]
regexes = [
  '''process\.env''',
  '''secrets\.''',
  '''\$\{\{''',
  '''YOUR_''',
  '''sk-ci-smoke-test-placeholder-not-real''',
  '''REDACTED=sk-ci-smoke-test-placeholder-not-real''',
  '''placeholder''',
  '''smoke-test''',
  '''ci-smoke-test''',
  '''ANTHROPIC_API_KEY''',
  '''ANTHROPIC_AUTH_TOKEN''',
]