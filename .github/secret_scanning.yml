# Secret scanning configuration
# See: https://docs.github.com/en/code-security/secret-scanning/defining-custom-patterns-for-secret-scanning

# Ignore lock files - contains npm package names that trigger false positives
# (e.g., @aws-sdk/credential-provider-*, @aws-sdk/token-providers are package names, not secrets)
paths-ignore:
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "package-lock.json"
  - "yarn.lock"

# Additional patterns to ignore in lock files
patterns-ignore:
  - "@aws-sdk/credential-provider-"
  - "@aws-sdk/token-providers"
  - "@smithy/credential-provider-imds"
  - "credential-provider-"
  - "token-providers"