name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47  # v4.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system deps
        run: sudo apt-get install -y ripgrep bats

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  eval-gate:
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47  # v4.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system deps
        run: sudo apt-get install -y ripgrep bats

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval-gate (Phase 1 exit gate)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOTO_VAULT_PATH: ${{ runner.temp }}/toto-vault
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "eval-gate: SKIP — ANTHROPIC_API_KEY not configured"
            exit 0
          fi
          mkdir -p "$TOTO_VAULT_PATH"
          git -C "$TOTO_VAULT_PATH" init
          git -C "$TOTO_VAULT_PATH" config user.email "ci@toto-wolff"
          git -C "$TOTO_VAULT_PATH" config user.name "toto-wolff-ci"
          pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/eval-gate.ts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        id: gitleaks-scan
        run: |
          GITLEAKS_EXIT_CODE=0
          gitleaks detect --config .gitleaks.toml --redact --no-banner --report-format json --report-path gitleaks-report.json --baseline-path .gitleaks-baseline.json --exit-code 1 || GITLEAKS_EXIT_CODE=$?
          echo "GITLEAKS_EXIT_CODE=$GITLEAKS_EXIT_CODE" >> "$GITHUB_ENV"

          echo "::group::gitleaks report"
          cat gitleaks-report.json || true
          echo "::endgroup::"

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

      - name: Fail if gitleaks found leaks
        run: |
          if [ "${GITLEAKS_EXIT_CODE:-0}" -ne 0 ]; then
            echo "gitleaks detected secrets (exit code ${GITLEAKS_EXIT_CODE}). See artifact 'gitleaks-report'."
            exit "${GITLEAKS_EXIT_CODE}"
          fi

  lint-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47  # v4.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The type-aware lint rules need the packages' built declarations: an
      # unbuilt tree reports ~300 extra no-unsafe-* violations (measured), so
      # the gate would fail every PR, or worse, a baseline regenerated unbuilt
      # would let those violations through.
      - name: Build
        run: pnpm build

      - name: Check for new ESLint violations against the committed baseline
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/check-eslint-baseline.ts

      # Unconditional, not path-filtered: a dependency, shared tsconfig or skill
      # change can desync the committed plugin/ folder from its sources without
      # touching packages/*/src, and path-filtering would silently reproduce
      # the staleness this check exists to catch. check:plugin-sync deletes
      # dist/ and tsconfig.tsbuildinfo and rebuilds itself, so this is a fresh
      # compile, then compares plugin/ (bundle and skill copies) with the
      # committed tree.
      - name: Check that the committed plugin/ folder matches a fresh rebuild
        run: pnpm check:plugin-sync

  check-patterns:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47  # v4.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sensitive-patterns sync
        run: |
          pnpm check-patterns 2>&1 | tee /tmp/check-patterns-output.txt
          cat /tmp/check-patterns-output.txt >> "$GITHUB_STEP_SUMMARY"

  validate-plugin-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.206

      # The repo root holds only the marketplace; the plugin itself ships from
      # plugin/. Both must validate with warnings treated as errors.
      - name: Validate the marketplace and the plugin manifest
        run: |
          claude plugin validate . --strict
          claude plugin validate plugin --strict

  plugin-launch-smoke-test:
    runs-on: ubuntu-latest
    needs: validate-plugin-manifest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.206

      - name: Install the plugin fresh (simulates a real marketplace install from the committed plugin/ folder, no build step)
        run: |
          claude plugin marketplace add "$(pwd)"
          claude plugin install toto-wolff@toto-wolff

      - name: Confirm the manifest's own declared launch command actually boots the server
        run: |
          set -euo pipefail
          CACHE_DIR=$(find "$HOME/.claude/plugins/cache/toto-wolff" -maxdepth 2 -type d -name '*.*.*' | sort -V | tail -1)
          if [ -z "$CACHE_DIR" ]; then
            echo "::error::plugin cache directory not found after install — 'claude plugin install' may have changed its cache layout"
            exit 1
          fi

          # (i) The installed cache is the plugin/ folder and nothing else: the
          # minified bundle, the listed skills (drs-check.sh still executable),
          # no symlinks (one pointing outside the folder ships dangling), and no
          # repository files such as packages/ (the whole repo used to ship).
          if [ ! -f "$CACHE_DIR/server/index.mjs" ]; then
            echo "::error::installed plugin cache is missing server/index.mjs: the plugin/ bundle was not committed"
            exit 1
          fi
          if [ ! -x "$CACHE_DIR/skills/drs/bin/drs-check.sh" ]; then
            echo "::error::skills/drs/bin/drs-check.sh is missing or not executable in the installed cache"
            exit 1
          fi
          if [ -n "$(find "$CACHE_DIR" -type l)" ]; then
            echo "::error::installed plugin cache contains symlinks: $(find "$CACHE_DIR" -type l)"
            exit 1
          fi
          if [ -e "$CACHE_DIR/packages" ]; then
            echo "::error::installed plugin cache contains packages/: the marketplace source is shipping the whole repository again"
            exit 1
          fi
          LISTED=$(jq '.skills | length' "$CACHE_DIR/.claude-plugin/plugin.json")
          FOUND=$(find "$CACHE_DIR/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          if [ "$LISTED" != "$FOUND" ]; then
            echo "::error::manifest lists $LISTED skills but the cache has $FOUND skill folders with a SKILL.md"
            exit 1
          fi

          # (ii) Read command/args directly from the installed manifest, never
          # hand-copy them, so this test fails the moment plugin.json's launch
          # command drifts from what actually works, instead of silently testing
          # a stale copy. jq footgun: a missing key returns the literal string
          # "null", not an empty string. Check both; a bare -z test alone would
          # silently pass on a broken manifest.
          COMMAND=$(jq -r '.mcpServers["toto-wolff"].command' "$CACHE_DIR/.claude-plugin/plugin.json")
          if [ -z "$COMMAND" ] || [ "$COMMAND" = "null" ]; then
            echo "::error::installed manifest's mcpServers.toto-wolff.command is missing or null"
            exit 1
          fi
          if [ "$COMMAND" != "node" ]; then
            echo "::error::installed manifest's mcpServers.toto-wolff.command is '$COMMAND', expected 'node': the launch mechanism regressed to a shell wrapper"
            exit 1
          fi
          ARGS=()
          while IFS= read -r arg; do
            ARGS+=("$arg")
          done < <(jq -r --arg root "$CACHE_DIR" \
            '.mcpServers["toto-wolff"].args[] | gsub("\\$\\{CLAUDE_PLUGIN_ROOT\\}"; $root)' \
            "$CACHE_DIR/.claude-plugin/plugin.json")
          RESOLVED_ARGS_PATH="${ARGS[0]:-}"
          if [ -z "$RESOLVED_ARGS_PATH" ] || [ "$RESOLVED_ARGS_PATH" = "null" ] || [ ! -f "$RESOLVED_ARGS_PATH" ]; then
            echo "::error::installed manifest's resolved args path ('$RESOLVED_ARGS_PATH') does not exist"
            exit 1
          fi

          # (iii) Launch using the exact command/args just read, never a
          # hand-written literal, so this exercises the real installed manifest,
          # not an assumption about what it says.
          #
          # ANTHROPIC_API_KEY is a placeholder, never a real secret: CouncilService/
          # P10Service construct eagerly at process startup (index.ts top level,
          # not lazily on first tool call — this is documented, intended behavior,
          # see CLAUDE.md's "MCP Server" section), so createAnthropicClient() throws
          # immediately with no credential at all. This test proves the launch
          # command resolves and the process runs — it never calls a tool, so no
          # real credential or network access is needed, only a non-empty string.
          ANTHROPIC_API_KEY=sk-ci-smoke-test-placeholder-not-real TOTO_MCP_PORT=0 "$COMMAND" "${ARGS[@]}" &
          SERVER_PID=$!
          sleep 60
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::MCP server exited within 60s of running the plugin's own declared launch command ($COMMAND ${ARGS[*]})"
            exit 1
          fi
          kill "$SERVER_PID"
          echo "Plugin launch smoke test passed: server started and stayed alive from the manifest's real, installed launch command."

      - name: Confirm Claude Code's own spawn path delivers the credential (userConfig unset, set, and absent)
        run: |
          set -euo pipefail
          # The step above launches with raw node, so it never exercises the
          # manifest's userConfig-to-env substitution. `claude mcp list` spawns
          # the server the way Claude Code really does. Claude Code substitutes
          # an unset optional userConfig value as an empty string, so case 1
          # fails if a manifest env entry ever overwrites a shell-exported key
          # again. Case 3 is the negative control: with no credential anywhere
          # the server must NOT connect, or cases 1 and 2 prove nothing.
          KEY=sk-ci-smoke-test-placeholder-not-real
          connected() {
            local out
            out=$(TOTO_MCP_PORT=0 timeout 120 claude mcp list 2>&1 || true)
            echo "$out"
            echo "$out" | grep -q "plugin:toto-wolff:toto-wolff:.*Connected"
          }

          # (1) Key exported in the shell, userConfig left unset.
          if ! ANTHROPIC_API_KEY="$KEY" connected; then
            echo "::error::server did not connect with a shell-exported key and userConfig unset: an empty userConfig value is shadowing the shell credential"
            exit 1
          fi

          # (3) No credential anywhere.
          if connected; then
            echo "::error::server connected with no credential configured anywhere, so this check cannot tell a working credential path from a broken one"
            exit 1
          fi

          # (2) Key supplied only through userConfig.
          claude plugin uninstall toto-wolff@toto-wolff
          claude plugin install toto-wolff@toto-wolff --config anthropic_api_key="$KEY"
          if ! connected; then
            echo "::error::server did not connect with the key supplied only through userConfig"
            exit 1
          fi
          echo "Credential spawn-path check passed: shell key survives an unset userConfig, userConfig key works alone, no key fails."

  pre-commit-hook-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install system deps
        run: sudo apt-get install -y bats

      - name: Run pre-commit hook bats tests
        run: bats tests/pre-commit.bats

  drs-conformance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47  # v4.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system deps
        run: sudo apt-get install -y bats jq

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (conformance check imports packages/core/dist, matching production)
        run: pnpm -C packages/core build

      - name: Run bash-vs-TS DRS conformance suite
        # jq is installed in this job (see system deps above) so the jq
        # branch is exercised directly here; the suite's own
        # run_bash_check_no_jq tests separately mask jq off PATH per-check
        # (scoped to just the drs-check.sh subprocess, not this whole bats
        # process). That's the "works here, dead on a jq-less machine"
        # coverage the council's ruling required, without the fragility of
        # masking PATH for bats-core's own internals, which weren't verified
        # to tolerate it.
        run: bats tests/drs-conformance.bats
